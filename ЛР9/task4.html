<body>
    <h1>Задание 4 — определение браузера</h1>

    <script language="JavaScript" type="text/JavaScript">
        // Для выполнения задания используется свойство appName объекта navigator
        if (navigator.appName == "Microsoft Internet Explorer") {
            window.location = "Ex1.html"; // перенаправление для Internet Explorer
        } else {
            window.location = "Ex2.html"; // перенаправление для любого другого браузера
        }
    </script>
