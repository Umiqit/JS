<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 3</title>
</head>
<body>
    <h1>Задание 3 — проверка электронного адреса</h1>

    <script>
        // Шаблон электронного адреса: имя@домен.зона
        var emailFormat = /^[\w.-]+@[\w-]+\.[\w.]{2,}$/;

        var email;

        // Повторный ввод, пока адрес не будет введён правильно
        do {
            email = prompt("Введите электронный адрес:", "");
            if (!emailFormat.test(email)) {
                alert("Оценка: электронный адрес введён НЕПРАВИЛЬНО. Попробуйте ещё раз.");
            }
        } while (!emailFormat.test(email));

        alert("Правильно введён электронный адрес");
        document.write("Электронный адрес '<b>" + email + "</b>' введён правильно");
    </script>
</body>
</html>
