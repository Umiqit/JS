<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 1</title>
</head>
<body>
    <h1>Задание 1 — регулярное выражение как объект, метод test()</h1>

    <script>
        // Регулярное выражение, созданное как объект (конструктор RegExp)
        // Шаблон: строка должна состоять только из русских и латинских букв
        var pattern = new RegExp("^[А-Яа-яЁёA-Za-z]+$");

        var str = prompt("Введите строку (только буквы):", "");

        // Метод test() возвращает true, если строка соответствует шаблону
        if (pattern.test(str)) {
            alert("Строка соответствует шаблону");
            document.write("Введённая строка '<b>" + str + "</b>' соответствует шаблону " + pattern);
        } else {
            alert("Строка НЕ соответствует шаблону");
            document.write("Введённая строка '<b>" + str + "</b>' НЕ соответствует шаблону " + pattern);
        }
    </script>
</body>
</html>
