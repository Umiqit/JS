<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 13</title>
</head>
<body>
    <h1>Задание 13 — факториал числа (цикл for)</h1>

    <script>
        let n = parseInt(prompt("Введите число для вычисления факториала:", "5"));

        let factorial = 1;
        for (let i = 1; i <= n; i++) {
            factorial *= i;   // factorial = factorial * i
        }

        alert(n + "! = " + factorial);
        document.write(n + "! = <b>" + factorial + "</b>");
    </script>
</body>
</html>
