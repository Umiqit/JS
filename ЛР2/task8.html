<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 8</title>
</head>
<body>
    <h1>Задание 8 — название молока по жирности</h1>

    <script>
        let fat = prompt("Введите процент жирности молока (2.5; 3.2; 3.5):", "2.5");

        switch (fat) {
            case "2.5":
                alert("Питьевое молоко 2,5%");
                break;
            case "3.2":
                alert("Молоко 3,2% — «Селянское»");
                break;
            case "3.5":
                alert("Молоко 3,5% — «Крестьянское»");
                break;
            default:
                alert("Такого вида молока нет в базе");
        }
    </script>
</body>
</html>
