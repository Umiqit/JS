<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 2</title>
</head>
<body>
    <h1>Задание 2 — анализ приращений</h1>

    <script>
        var number = 3;

        // Префиксный инкремент: сначала увеличивает, потом выводит -> 4
        alert('Число после выполнения приращения равняется ' + ++number);

        // Постфиксный декремент: сначала выводит, потом уменьшает -> выводится 4, затем number = 3
        alert('Число после выполнения отрицательного приращения равняется ' + number--);

        // Унарный минус (отрицание): меняет знак -> -3
        alert('Число после выполнения отрицания равняется ' + -number);

        document.write("<b>Анализ результата:</b><br>");
        document.write("1) ++number — префиксный инкремент: значение увеличивается ДО вывода, поэтому выводится 4;<br>");
        document.write("2) number-- — постфиксный декремент: значение уменьшается ПОСЛЕ вывода, поэтому выводится 4, а в переменной остаётся 3;<br>");
        document.write("3) -number — унарный минус: меняет знак числа, поэтому выводится -3.");
    </script>
</body>
</html>
