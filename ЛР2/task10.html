<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 10</title>
</head>
<body>
    <h1>Задание 10 — максимальное из 3 чисел</h1>

    <script>
        let a = parseFloat(prompt("Введите первое число:", ""));
        let b = parseFloat(prompt("Введите второе число:", ""));
        let c = parseFloat(prompt("Введите третье число:", ""));

        let max = a;
        if (b > max) max = b;
        if (c > max) max = c;

        alert("Максимальное число: " + max);
        document.write("Числа: " + a + ", " + b + ", " + c + "<br>");
        document.write("<b>Максимальное число: " + max + "</b>");
    </script>
</body>
</html>
