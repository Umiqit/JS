<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 3</title>
</head>
<body>
    <h1>Задание 3 — сравнение двух переменных</h1>

    <script>
        let a = parseFloat(prompt("Введите первое число:", ""));
        let b = parseFloat(prompt("Введите второе число:", ""));

        document.write("a = " + a + ", b = " + b + "<br><br>");

        // Операторы сравнения
        document.write("a > b : " + (a > b) + "<br>");
        document.write("a < b : " + (a < b) + "<br>");
        document.write("a >= b : " + (a >= b) + "<br>");
        document.write("a <= b : " + (a <= b) + "<br>");
        document.write("a == b : " + (a == b) + "<br>");
        document.write("a != b : " + (a != b) + "<br>");
        document.write("a === b : " + (a === b) + " (строгое равенство с учётом типа)");
    </script>
</body>
</html>
