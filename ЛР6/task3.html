<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 3. Объект Math</title>
</head>
<body>
    <h1>Задание 3.1–3.3 — объект Math</h1>

    <!-- 3.1 Функция считывает имя кнопки при её нажатии и возвращает имя в alert() -->
    <input type="button" value="кликни меня" onclick="showButtonName(this)">

    <script>
        // Оператор this указывает на кнопку, вызвавшую функцию
        function showButtonName(button) {
            alert("кликни меня кнопочка " + button.value);
        }
    </script>

    <!-- 3.2 Расчёт площади круга: радиус в поле формы, результат в alert(), округление до сотых -->
    <h2>3.2 Площадь круга</h2>
    <form name="circleForm">
        Введите радиус для круга:
        <input type="text" name="radius" size="10">
        <input type="button" value="кликни меня" onclick="circleArea()">
    </form>

    <script>
        function circleArea() {
            var r = parseFloat(document.circleForm.radius.value);
            var area = Math.PI * r * r;            // объект Math
            area = Math.round(area * 100) / 100;   // округление до сотых
            alert("площадь круга " + area + " с радиусом " + r);
        }
    </script>

    <!-- 3.3 Площадь прямоугольника: значения из полей формы, результат — в поле формы -->
    <h2>3.3 Площадь прямоугольника</h2>
    <form name="rectForm">
        Введите высоту: <input type="text" name="height" size="10"><br>
        Введите ширину: <input type="text" name="width" size="10"><br>
        <input type="button" value="Вычислить" onclick="rectArea()"><br>
        Результат: <input type="text" name="result" size="15">
    </form>

    <script>
        function rectArea() {
            var h = parseFloat(document.rectForm.height.value);
            var w = parseFloat(document.rectForm.width.value);
            document.rectForm.result.value = h * w; // результат выводится в поле формы
        }
    </script>
</body>
</html>
