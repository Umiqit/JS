<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 6</title>
</head>
<body>
    <h1>Задание 6</h1>

    <script>
        // Преобразование строки в целое число
        let a = parseInt("123");
        document.write('parseInt("123") = ' + a + "<br>");

        // Преобразование строки в число с десятичной точкой
        let b = parseFloat("3.14");
        document.write('parseFloat("3.14") = ' + b + "<br>");

        // Преобразование невозможно — результат NaN (Not a Number)
        let c = parseInt("abc");
        document.write('parseInt("abc") = ' + c + "<br>");

        let d = parseFloat("12,5"); // точка, а не запятая — преобразование обрывается
        document.write('parseFloat("12,5") = ' + d + "<br>");
    </script>
</body>
</html>
