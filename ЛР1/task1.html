<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 1</title>
</head>
<body>
    <h1>Задание 1</h1>

    <script>
        // Разные типы диалоговых окон
        alert("Это информационное окно alert()");

        let answer = confirm("Это окно confirm(). Нажмите ОК или Отмена");
        document.write("Вы нажали в confirm(): " + answer + "<br>");

        let name = prompt("Это окно prompt(). Введите что-нибудь:", "значение по умолчанию");
        document.write("Вы ввели в prompt(): " + name + "<br>");

        // Вывод текста в окно браузера
        document.write("<b>Текст, выведенный в окно браузера командой document.write()</b>");
    </script>
</body>
</html>
