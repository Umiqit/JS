<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 2.3 — доступ к элементу через this</title>
</head>
<body>
    <h1>Задание 2.3 — доступ к элементу через this</h1>

    Введите данные:
    <input type="text" id="inputField" value="введите данные">
    <!-- this — ссылка на текущий элемент, обратиться к соседним элементам
         можно через this.form / this.parentElement и т.д. -->
    <input type="button" value="Передать"
           onclick="confirmInput(this.parentElement.querySelector('#inputField'),
                                 this.parentElement.querySelector('#outputField'))">

    <p>Подтверждённые данные:</p>
    <input type="text" id="outputField">

    <script>
        function confirmInput(inputEl, outputEl) {
            var data = inputEl.value;
            if (confirm("Подтвердите введённые данные: " + data)) {
                outputEl.value = data;
            } else {
                alert("Повторите ввод.");
                inputEl.focus();
            }
        }
    </script>
</body>
</html>
