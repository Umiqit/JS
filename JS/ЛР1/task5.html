<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 5</title>
</head>
<body>
    <h1>Задание 5</h1>

    <script>
        // Переменная строкового типа
        let str = "Строка текста";
        document.write("Строковая переменная: " + str + "<br>");

        // Переменная числового типа
        let num = 42;
        document.write("Числовая переменная: " + num + "<br>");

        // Переменная комбинированного типа (строка + число)
        let combined = str + " № " + num;
        document.write("Комбинированная переменная: " + combined + "<br>");
    </script>
</body>
</html>
