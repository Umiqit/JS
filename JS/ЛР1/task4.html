<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 4</title>
</head>
<body>
    <h1>Задание 4</h1>

    <script>
        // Диалоговое окно с полем ввода и значением по умолчанию
        let name = prompt("Введите сюда своё имя", "Введите имя");

        // Вывод введённого имени в окно браузера жирным шрифтом и курсивом
        document.write("Ваше имя <b><i>" + name + "</i></b>");

        // Новое диалоговое окно "Начать заново?"
        if (confirm("Начать заново?")) {
            alert("Не надоело?");
        } else {
            alert("Ну и правильно!");
        }
    </script>
</body>
</html>
