<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 12</title>
</head>
<body>
    <h1>Задание 12 — первые пять кратных чисел</h1>

    <script>
        let n = parseInt(prompt("Введите число:", ""));

        let result = "Первые пять чисел, кратных " + n + ":\n";
        for (let i = 1; i <= 5; i++) {
            result += (n * i) + "\n";
        }

        alert(result);
    </script>
</body>
</html>
