<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 9</title>
</head>
<body>
    <h1>Задание 9 — оценка имени пользователя и пароля</h1>

    <script>
        // Заданные в коде имя и пароль
        const correctName = "admin";
        const correctPassword = "12345";

        let name = prompt("Введите имя:", "");
        let password = prompt("Введите пароль:", "");

        if (name == correctName && password == correctPassword) {
            alert("Пароль и имя верны");
            document.write("<b>Пароль и имя верны. Добро пожаловать, " + name + "!</b>");
        } else {
            alert("Неправильно введены пароль и имя");
            document.write("<b>Неправильно введены пароль и имя.</b>");
        }
    </script>
</body>
</html>
