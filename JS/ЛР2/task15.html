<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 15</title>
</head>
<body>
    <h1>Задание 15 — вывод значений циклом</h1>

    <script>
        // Внешний цикл формирует строки (от 0 до 10 — 11 строк)
        for (let i = 0; i <= 10; i++) {
            // Внутренний цикл выводит цифры от 0 до i
            for (let j = 0; j <= i; j++) {
                document.write(j);
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
