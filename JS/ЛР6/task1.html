<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 1. Объекты</title>
</head>
<body>
    <h1>Задание 1.1–1.3 — объекты</h1>

    <script>
        // 1. Создайте пустой объект «Пользователь»
        var user = {};

        // Функция проверки: возвращает true, если у объекта нет свойств
        function isEmpty(obj) {
            for (var key in obj) {
                return false;
            }
            return true;
        }

        document.write("Объект пустой: " + isEmpty(user) + "<br>");

        // 2. Добавьте свойства: имя, отчество, фамилия
        user.name = "Иван";
        user.patronymic = "Иванович";
        user.surname = "Иванов";

        // 3. Добавьте свойство студент со значением группы
        user.student = "ИВТ-101";

        // 4. Измените значение свойства имени на имя соседа
        user.name = "Пётр";

        // 5. Удалите свойство имени из объекта
        delete user.name;

        document.write("Объект после изменений (имя удалено): " + JSON.stringify(user) + "<br>");
        document.write("Объект пустой теперь: " + isEmpty(user) + "<br><br>");

        // 1.2 Объект с днями недели, ключи — номера дней от начала недели
        var daysOfWeek = {
            1: "понедельник",
            2: "вторник",
            3: "среда",
            4: "четверг",
            5: "пятница",
            6: "суббота",
            7: "воскресенье"
        };

        // Вывод на экран текущего дня недели
        var today = new Date().getDay();           // 0 — воскресенье ... 6 — суббота
        var dayNumber = (today === 0) ? 7 : today; // переводим в систему, где понедельник — первый
        document.write("<b>Сегодня: " + daysOfWeek[dayNumber] + "</b><br><br>");

        // 1.3 Номер дня недели хранится в переменной day
        var day = 3;
        document.write("day = " + day + " — это " + daysOfWeek[day]);
    </script>
</body>
</html>
