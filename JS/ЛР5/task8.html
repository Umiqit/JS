<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 8</title>
</head>
<body>
    <h1>Задание 8 — подсчёт отрицательных, положительных и нулевых элементов</h1>

    <script>
        // Дан массив чисел
        let arr = [5, -3, 0, 12, -7, 0, 4, -1, 8, 0];
        document.write("Дан массив: " + arr.join(", ") + "<br><br>");

        // Подсчёт отрицательных, положительных и нулевых элементов
        let negative = 0, positive = 0, zero = 0;

        for (let i = 0; i < arr.length; i++) {
            if (arr[i] < 0) {
                negative++;
            } else if (arr[i] > 0) {
                positive++;
            } else {
                zero++;
            }
        }

        document.write("Отрицательных элементов: <b>" + negative + "</b><br>");
        document.write("Положительных элементов: <b>" + positive + "</b><br>");
        document.write("Нулевых элементов: <b>" + zero + "</b>");
    </script>
</body>
</html>
