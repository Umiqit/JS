<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изучение DOM-дерева</title>
</head>
<body>
    <h1>Задание 1.1–1.2 — изучение DOM-дерева</h1>

    <p>Документ для просмотра структуры DOM в реальном времени.</p>

    <ul>
        <li>Первый элемент списка</li>
        <li>Второй элемент списка</li>
        <li>Третий элемент списка</li>
    </ul>

    <div id="container">
        <p class="text">Текстовый абзац внутри контейнера</p>
        <a href="https://learn.javascript.ru/dom-nodes">Ссылка на учебник</a>
    </div>

    <form>
        <input type="text" name="sample" value="поле ввода">
        <input type="button" value="кнопка">
    </form>

    <!--
        Инструкция:
        1.1 Откройте эту страницу в браузере, посмотрите её структуру DOM
            в реальном времени, применив Live DOM Viewer
            (http://software.hixie.ch/utilities/js/live-dom-viewer/).
            Измените структуру документа и проанализируйте, как изменится
            структура DOM.
        1.2 Исследуйте DOM, применив инструменты разработчика браузера:
            откройте страницу, включите инструменты разработчика (F12)
            и перейдите на вкладку Elements. Понажимайте на элементы,
            детально рассмотрите их и так далее.
    -->
</body>
</html>
