<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задания листа №4 — задание 1 (focus/blur)</title>
</head>
<body>
    <h1>Задание 1 — события onFocus и onBlur</h1>

    <!-- При наведении на текстовое поле появляется окно «привет»,
         после потери фокуса — окно «до свидания» -->
    <input type="text" onfocus="alert('привет')" onblur="alert('до свидания')" placeholder="щёлкните в поле">

</body>
</html>
