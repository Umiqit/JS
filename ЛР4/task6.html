<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 6</title>
</head>
<body>
    <h1>Задание 6 — положительные и отрицательные значения</h1>

    <script>
        let n = parseInt(prompt("Введите количество элементов массива:", "5"));
        let arr = [];

        for (let i = 0; i < n; i++) {
            arr[i] = parseFloat(prompt("Введите элемент [" + i + "]:", ""));
        }

        // Положительные значения с порядковым номером
        document.write("<b>Положительные значения:</b><br>");
        for (let i = 0; i < arr.length; i++) {
            if (arr[i] > 0) {
                document.write((i + 1) + ") " + arr[i] + "<br>");
            }
        }

        // Отрицательные значения с порядковым номером
        document.write("<b>Отрицательные значения:</b><br>");
        for (let i = 0; i < arr.length; i++) {
            if (arr[i] < 0) {
                document.write((i + 1) + ") " + arr[i] + "<br>");
            }
        }
    </script>
</body>
</html>
